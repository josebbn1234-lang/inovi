</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f0d;
    color: #e6e6e6;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding: 30px 16px 80px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  header img.logo { max-width: 220px; width: 100%; height: auto; }
  header p { color: #999; margin-top: 6px; font-size: 0.88rem; }
  .section {
    background: #161814;
    border: 1px solid #2a2e26;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .section h2 {
    color: #ff6b1a;
    font-size: 1rem;
    margin-bottom: 14px;
    border-bottom: 1px solid #2a2e26;
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    background: #0d0f0d;
    border: 1px solid #333;
    color: #f0f0f0;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #ff6b1a; }
  textarea { resize: vertical; min-height: 60px; }
  .field-full { grid-column: 1 / -1; }

  .payment-row {
    background: #0f110d;
    border: 1px solid #2a2e26;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    position: relative;
  }
  .payment-row .row-top {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .payment-row select.tipo { flex: 1; margin-bottom: 0; }
  .btn-remove {
    background: #3a1414;
    color: #ff8080;
    border: 1px solid #5a2020;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .btn-remove:hover { background: #4a1a1a; }
  .payment-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .payment-fields.single { grid-template-columns: 1fr; }

  .btn-add {
    width: 100%;
    background: transparent;
    color: #ff6b1a;
    border: 1.5px dashed #ff6b1a;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    margin-top: 4px;
  }
  .btn-add:hover { background: rgba(255,107,26,0.08); }

<div id="telaSenha" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0d0f0d; padding:20px;">
  <div style="max-width:340px; width:100%; background:#161814; border:1px solid #2a2e26; border-radius:14px; padding:30px; text-align:center;">
    <h2 style="color:#b6ff3c; margin-bottom:18px; font-size:1.2rem;">🔒 Acesso restrito</h2>
    <p style="color:#999; font-size:0.85rem; margin-bottom:16px;">Digite a senha para acessar o emissor de contrato</p>
    <input type="password" id="inputSenha" placeholder="Senha" style="width:100%; background:#0d0f0d; border:1px solid #333; color:#f0f0f0; padding:12px; border-radius:8px; font-size:1rem; margin-bottom:12px; text-align:center;" onkeydown="if(event.key==='Enter') verificarSenha()">
    <button onclick="verificarSenha()" style="width:100%; background:#b6ff3c; color:#0d0f0d; border:none; padding:12px; font-size:1rem; font-weight:700; border-radius:8px; cursor:pointer;">Entrar</button>
    <p id="msgSenhaErrada" style="color:#ff5c5c; font-size:0.82rem; margin-top:12px; display:none;">Senha incorreta. Tente de novo.</p>
  </div>
</div>

<div class="container" id="appConteudo" style="display:none;">
  <header>
    <img class="logo" id="logoHeader" alt="INOVI Veículos">
  </header>

  <div class="section">
    <h2>Comprador</h2>
    <div class="grid">
      <div class="field-full">
        <label>Nome completo</label>
        <input type="text" id="compradorNome" placeholder="Ex: Yuri Cavalcante Miranda">
      </div>
      <div>
        <label>CPF</label>
        <input type="text" id="compradorCpf" placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascara(this, maskCPF)">
      </div>
      <div>
        <label>Telefone</label>
        <input type="text" id="compradorTelefone" placeholder="(83) 9 9999-8888" maxlength="15" oninput="aplicarMascara(this, maskPhone)">
      </div>
      <div class="field-full">
        <label>Endereço completo</label>
        <input type="text" id="compradorEndereco" placeholder="Rua, número, bairro, cidade/UF">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Veículo</h2>
    <div class="grid">
      <div class="field-full">
        <label>Marca/Modelo</label>
        <input type="text" id="veiculoMarcaModelo" placeholder="Ex: TOYOTA/YARIS XL">
      </div>
      <div>
        <label>Ano Fabricação/Modelo</label>
        <input type="text" id="veiculoAno" placeholder="Ex: 2020/2021">
      </div>
      <div>
        <label>Placa</label>
        <input type="text" id="veiculoPlaca" placeholder="Ex: ABC1D23" maxlength="7" oninput="aplicarMascara(this, maskPlaca)">
      </div>
      <div>
        <label>Quilometragem</label>
        <input type="text" id="veiculoKm" placeholder="Ex: 10.000" oninput="aplicarMascara(this, maskInteiro)">
      </div>
      <div>
        <label>Valor do veículo (R$)</label>
        <input type="text" id="veiculoValor" placeholder="Ex: 82.900,00" oninput="aplicarMascara(this, maskMoney)">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Condições da Venda</h2>
    <div class="grid">
      <div class="field-full">
        <label>Transferência e emplacamento por conta de:</label>
        <select id="transferenciaEmplacamento">
          <option value="loja">Loja</option>
          <option value="comprador">Comprador</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>
      Formas de Pagamento
    </h2>
    <div id="paymentRows"></div>
    <button type="button" class="btn-add" onclick="addPaymentRow()">+ Adicionar forma de pagamento</button>
    <div class="total-display">TOTAL: <span id="totalDisplay">R$ 0,00</span></div>
  </div>

  <div class="section">
    <h2>Data e Local</h2>
    <div class="grid">
      <div>
        <label>Cidade</label>
        <input type="text" id="cidade" value="CABEDELO">
      </div>
      <div>
        <label>Data</label>
        <input type="date" id="dataContrato">
      </div>
      <div class="field-full">
        <label>Observações adicionais (opcional, some abaixo do texto de garantia)</label>
        <textarea id="observacoes" placeholder="Ex: alguma condição especial deste contrato"></textarea>
      </div>
    </div>
  </div>

  <button id="gerarBtn" onclick="gerarPDF()">📄 Emitir Contrato</button>
  <p class="erro" id="msgErro"></p>
  <p class="aviso">Documento gerado localmente no seu navegador. Nenhum dado é enviado ou armazenado em servidor.</p>
</div>

function addPaymentRow() {
  rowCounter++;
  const rowId = 'row' + rowCounter;
  const div = document.createElement('div');
  div.className = 'payment-row';
  div.id = rowId;
  div.innerHTML = `
    <div class="row-top">
      <select class="tipo" onchange="renderPaymentFields('${rowId}')">
        <option value="pix">Pix</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="transferencia">Transferência</option>
        <option value="financiamento">Financiamento</option>
        <option value="entrada">Veículo de entrada</option>
        <option value="quitacao">Quitação de veículo</option>
        <option value="outro">Outro</option>
      </select>
      <button type="button" class="btn-remove" onclick="removePaymentRow('${rowId}')">Remover</button>
    </div>
    <div class="payment-fields" id="${rowId}_fields"></div>
  `;
  document.getElementById('paymentRows').appendChild(div);
  renderPaymentFields(rowId);
}

function removePaymentRow(rowId) {
  const el = document.getElementById(rowId);
  if (el) el.remove();
  updateTotal();
}

function renderPaymentFields(rowId) {
  const row = document.getElementById(rowId);
  const tipo = row.querySelector('.tipo').value;
  const fieldsContainer = document.getElementById(rowId + '_fields');
  const campos = TIPOS_CAMPOS[tipo];
  fieldsContainer.className = 'payment-fields' + (campos.length <= 1 ? ' single' : '');
  fieldsContainer.innerHTML = campos.map(c => {
    let oninput = 'updateTotal()';
    if (c.mask === 'money') oninput = "aplicarMascara(this, maskMoney); updateTotal();";
    else if (c.mask === 'placa') oninput = "aplicarMascara(this, maskPlaca); updateTotal();";
    else if (c.mask === 'inteiro') oninput = "aplicarMascara(this, maskInteiro); updateTotal();";
    const maxlength = c.mask === 'placa' ? ' maxlength="7"' : '';
    return `
    <div>
      <label>${c.label}</label>
      <input type="${c.type}" id="${rowId}_${c.id}" placeholder="${c.placeholder}"${maxlength} oninput="${oninput}">
    </div>
  `;
  }).join('');
  updateTotal();
}

function parseMoneyBR(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
  const num = parseFloat(cleaned);
  return isNaN(num) ? 0 : num;
}

function formatMoneyBR(num) {
  return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ================= MÁSCARAS DE FORMATAÇÃO ================= */
function onlyDigits(str) { return (str || '').replace(/\D/g, ''); }

function maskCPF(value) {
  let v = onlyDigits(value).slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, '$1.$2');
  v = v.replace(/(\d{3})(\d)/, '$1.$2');
  v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  return v;
}

function maskPhone(value) {
  let v = onlyDigits(value).slice(0, 11);
  if (v.length > 10) {
    v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
  } else if (v.length > 5) {
    v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
  } else if (v.length > 2) {
    v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
  } else if (v.length > 0) {
    v = v.replace(/(\d{0,2})/, '($1');
  }
  return v;
}

function maskMoney(value) {
  let v = onlyDigits(value);
  if (!v) return '';
  v = v.replace(/^0+(?=\d)/, '');
  v = v.padStart(3, '0');
  const cents = v.slice(-2);
  let intPart = v.slice(0, -2).replace(/^0+(?=\d)/, '');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return intPart + ',' + cents;
}

function maskInteiro(value) {
  let v = onlyDigits(value);
  if (!v) return '';
  v = v.replace(/^0+(?=\d)/, '');
  v = v.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return v;
}

function maskPlaca(value) {
  return (value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
}

function aplicarMascara(el, fn) {
  const cursorFromEnd = el.value.length - el.selectionStart;
  el.value = fn(el.value);
  const pos = Math.max(0, el.value.length - cursorFromEnd);
  el.setSelectionRange(pos, pos);
}

function getPaymentLines() {
  const rows = document.querySelectorAll('.payment-row');
  const lines = [];
  rows.forEach(row => {
    const rowId = row.id;
    const tipo = row.querySelector('.tipo').value;
    const get = (campo) => {
      const el = document.getElementById(rowId + '_' + campo);
      return el ? el.value.trim() : '';
    };
    let valor = 0;
    let label = '';
    let detalhe = '';

    if (tipo === 'pix') {
      valor = parseMoneyBR(get('valor'));
      label = 'PIX';
    } else if (tipo === 'dinheiro') {
      valor = parseMoneyBR(get('valor'));
      label = 'DINHEIRO';
    } else if (tipo === 'transferencia') {
      valor = parseMoneyBR(get('valor'));
      label = 'TRANSFERÊNCIA';
    } else if (tipo === 'financiamento') {
      valor = parseMoneyBR(get('valor'));
      const banco = get('banco');
      const obs = get('obs');
      const parcelas = parseInt(get('parcelas')) || 0;
      const valorParcela = parseMoneyBR(get('valorParcela'));
      label = 'FINANCIAMENTO';
      if (banco || parcelas || obs) {
        detalhe = `Financiado junto ao ${banco || 'banco informado'}${parcelas ? ' em ' + parcelas + 'x de R$ ' + formatMoneyBR(valorParcela) : ''}${obs ? '. ' + obs : ''}.`;
      }
    } else if (tipo === 'entrada') {
      valor = parseMoneyBR(get('valor'));
      label = 'VEÍCULO DE ENTRADA';
      const marcaModelo = get('marcaModelo');
      const ano = get('ano');
      const placa = get('placa');
      const km = get('km');
      if (marcaModelo || placa) {
        detalhe = `Veículo recebido como entrada: ${marcaModelo}${ano ? ' ' + ano : ''}${placa ? ', Placa ' + placa : ''}${km ? ', KM ' + km : ''}.`;
      }
    } else if (tipo === 'quitacao') {
      valor = parseMoneyBR(get('valor'));
      label = 'QUITAÇÃO DE VEÍCULO';
      const banco = get('banco');
      const descricao = get('descricao');
      if (banco || descricao) {
        detalhe = `Quitação referente a ${descricao || 'veículo recebido'}${banco ? ' junto ao ' + banco : ''}.`;
      }
    } else if (tipo === 'outro') {
      valor = parseMoneyBR(get('valor'));
      const descricao = get('descricao');
      label = (descricao || 'OUTRO').toUpperCase();
    }

    lines.push({ label, valor, detalhe });
  });
  return lines;
}

function updateTotal() {
  const lines = getPaymentLines();
  const total = lines.reduce((sum, l) => sum + l.valor, 0);
  document.getElementById('totalDisplay').textContent = 'R$ ' + formatMoneyBR(total);
}

/* ================= GERAÇÃO DO PDF ================= */
const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

function formatarDataExtenso(dataStr) {
  const d = dataStr ? new Date(dataStr + 'T12:00:00') : new Date();
  return `${d.getDate()} DE ${MESES[d.getMonth()]} DE ${d.getFullYear()}`;
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function mostrarErro(msg) {
  const el = document.getElementById('msgErro');
  el.textContent = msg;
  el.style.display = 'block';
}

function gerarPDF() {
  try {
    gerarPDFInterno();
  } catch (erro) {
    alert('Ocorreu um erro ao emitir o contrato:\n\n' + erro.message + '\n\nTire um print desta mensagem e me mande.');
  }
}

function gerarPDFInterno() {
  const compradorNome = val('compradorNome');
  const compradorCpf = val('compradorCpf');
  const veiculoMarcaModelo = val('veiculoMarcaModelo');
  const paymentLines = getPaymentLines().filter(l => l.valor > 0 || l.label);

  if (!compradorNome || !compradorCpf || !veiculoMarcaModelo) {
    mostrarErro('Preencha pelo menos o nome do comprador, CPF e o veículo.');
    return;
  }
  if (paymentLines.length === 0) {
    mostrarErro('Adicione ao menos uma forma de pagamento.');
    return;
  }

  const total = paymentLines.reduce((sum, l) => sum + l.valor, 0);
  const veiculoValor = parseMoneyBR(val('veiculoValor'));
  if (veiculoValor > 0 && Math.abs(veiculoValor - total) > 0.01) {
    mostrarErro(`O valor do veículo (R$ ${formatMoneyBR(veiculoValor)}) não bate com a soma das formas de pagamento (R$ ${formatMoneyBR(total)}). Confira os valores.`);
    return;
  }
  document.getElementById('msgErro').style.display = 'none';

  const compradorTelefone = val('compradorTelefone');
  const compradorEndereco = val('compradorEndereco');
  const veiculoAno = val('veiculoAno');
  const veiculoPlaca = val('veiculoPlaca');
  const veiculoKm = val('veiculoKm');
  const cidade = val('cidade') || 'CABEDELO';
  const dataExtenso = formatarDataExtenso(val('dataContrato'));
  const observacoes = val('observacoes');
  const transferenciaResponsavel = val('transferenciaEmplacamento') || 'loja';

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const marginLeft = 55;
  const marginRight = 55;
  const usableWidth = pageWidth - marginLeft - marginRight;
  let y = 50;

  function checkPageBreak(needed) {
    if (y + needed > 780) {
      doc.addPage();
      y = 50;
    }
  }

  function addParagraph(text, opts = {}) {
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setFontSize(opts.size || 10.5);
    const align = opts.align || 'left';
    const x = align === 'center' ? pageWidth / 2 : marginLeft;
    const lines = doc.splitTextToSize(text, opts.width || usableWidth);
    lines.forEach(line => {
      checkPageBreak(16);
      doc.text(line, x, y, { align });
      y += opts.lineHeight || 14;
    });
    y += opts.spacing !== undefined ? opts.spacing : 8;
  }

  function addRichParagraph(segments, opts = {}) {
    const fontSize = opts.size || 10.5;
    const lineHeight = opts.lineHeight || 14;
    doc.setFontSize(fontSize);
    const spaceWidth = (() => { doc.setFont('helvetica', 'normal'); return doc.getTextWidth(' '); })();

    let words = [];
    segments.forEach(seg => {
      seg.text.split(/\s+/).filter(w => w.length > 0).forEach(w => {
        words.push({ text: w, bold: !!seg.bold, underline: !!seg.underline });
      });
    });

    let line = [];
    let lineWidth = 0;

    function drawLine(lineWords) {
      checkPageBreak(lineHeight + 2);
      let x = marginLeft;
      lineWords.forEach(w => {
        doc.setFont('helvetica', w.bold ? 'bold' : 'normal');
        const wWidth = doc.getTextWidth(w.text);
        doc.text(w.text, x, y);
        if (w.underline) {
          doc.setLineWidth(0.6);
          doc.line(x, y + 2, x + wWidth, y + 2);
        }
        x += wWidth + spaceWidth;
      });
      y += lineHeight;
    }

    words.forEach(w => {
      doc.setFont('helvetica', w.bold ? 'bold' : 'normal');
      const wWidth = doc.getTextWidth(w.text);
      if (lineWidth + wWidth > usableWidth && line.length > 0) {
        drawLine(line);
        line = [];
        lineWidth = 0;
      }
      line.push(w);
      lineWidth += wWidth + spaceWidth;
    });
    if (line.length > 0) drawLine(line);
    y += opts.spacing !== undefined ? opts.spacing : 8;
  }

  function addDottedLine(label, valueStr, detalhe) {
    checkPageBreak(16);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10.5);
    const valueDisplay = 'R$ ' + valueStr;
    const valueWidth = doc.getTextWidth(valueDisplay);
    const labelWidth = doc.getTextWidth(label + ' ');
    const dotWidth = doc.getTextWidth('.');
    const dotsSpace = usableWidth - labelWidth - valueWidth - 4;
    const numDots = Math.max(3, Math.floor(dotsSpace / dotWidth));
    const dots = '.'.repeat(numDots);
    doc.text(label + ' ' + dots, marginLeft, y);
    doc.text(valueDisplay, marginLeft + usableWidth, y, { align: 'right' });
    y += 15;
    if (detalhe) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      const detalheLines = doc.splitTextToSize(detalhe, usableWidth);
      detalheLines.forEach(line => {
        checkPageBreak(14);
        doc.text(line, marginLeft, y);
        y += 12;
      });
    }
    y += 4;
  }

  // Logo
  try {
    const logoWidth = 170;
    const logoHeight = 74;
    doc.addImage(LOGO_BASE64, 'PNG', (pageWidth - logoWidth) / 2, y, logoWidth, logoHeight);
    y += logoHeight + 14;
  } catch (e) {
    y += 10;
  }

  // Cabeçalho empresa
  addParagraph(EMPRESA.endereco, { bold: true, align: 'center', size: 10, spacing: 2 });
  addParagraph(EMPRESA.telefone, { bold: true, align: 'center', size: 10, spacing: 18 });

  // Título
  addParagraph('DECLARAÇÃO DE VENDA', { bold: true, align: 'center', size: 13, spacing: 16 });

  // Texto declaração
  addParagraph('DECLARO PARA OS DEVIDOS FINS QUE VENDI AO(A) SR(A).:', { spacing: 4 });
  addParagraph(
    `${compradorNome}, CPF: ${compradorCpf}${compradorEndereco ? ', ' + compradorEndereco : ''}.`,
    { bold: true, spacing: 4 }
  );
  if (compradorTelefone) {
    addParagraph(`TELEFONE ${compradorTelefone}`, { spacing: 14 });
  } else {
    y += 10;
  }

  addParagraph('O VEÍCULO ABAIXO DESCRIMINADO', { bold: true, spacing: 4 });
  addParagraph(
    `${veiculoMarcaModelo}${veiculoAno ? ' ' + veiculoAno : ''}${veiculoPlaca ? ' PLACA ' + veiculoPlaca : ''}`,
    { bold: true, spacing: 2 }
  );
  if (veiculoKm) {
    addParagraph(`QUILOMETRAGEM KM ${veiculoKm}`, { bold: true, spacing: 16 });
  } else {
    y += 12;
  }

  addParagraph('COMPRA SÃO AS SEGUINTES:', { bold: true, spacing: 10 });

  paymentLines.forEach(line => {
    addDottedLine(line.label, formatMoneyBR(line.valor), line.detalhe);
  });

  y += 4;
  checkPageBreak(20);
  doc.setLineWidth(0.5);
  doc.line(marginLeft, y, pageWidth - marginRight, y);
  y += 14;
  addDottedLine('TOTAL', formatMoneyBR(total));

  y += 10;
  const textoTransferencia = transferenciaResponsavel === 'comprador'
    ? 'TRANSFERÊNCIA E EMPLACAMENTO POR CONTA DO COMPRADOR.'
    : 'TRANSFERÊNCIA E EMPLACAMENTO POR CONTA DA LOJA.';
  addParagraph(textoTransferencia, { bold: true, spacing: 16 });

  addRichParagraph([
    { text: 'OBS:', bold: true },
    { text: ` ${EMPRESA.nome}, CNPJ: ${EMPRESA.cnpj} ` },
    { text: 'ASSUME A RESPONSABILIDADE DE PROCEDÊNCIA E MULTAS DO VEÍCULO ORA VENDIDO', bold: true, underline: true },
    { text: ' ATÉ ESTA DATA. OUTROSSIM INFORMAMOS, QUE ESTE VEÍCULO TEM ' },
    { text: 'GARANTIA DE 90 (NOVENTA) DIAS OU 5 MIL KM DE MOTOR E CAIXA DE MARCHA,', bold: true },
    { text: ' O QUE OCORRER A PARTIR DESTA DATA/QUILOMETRAGEM, DESDE QUE NÃO HAJA ALTERAÇÕES NOS COMPONENTES ORIGINAIS DO VEÍCULO ORA VENDIDO.' }
  ], { spacing: 16 });

  if (observacoes) {
    addParagraph(observacoes, { spacing: 16 });
  }

  addParagraph(`${cidade} ${dataExtenso}`, { bold: true, align: 'center', spacing: 20 });

  // Assinaturas (bloco único, garante que as duas fiquem juntas na mesma página)
  checkPageBreak(90);
  y += 10;
  doc.setLineWidth(0.5);
  doc.line(marginLeft, y, pageWidth - marginRight, y);
  y += 16;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.text(`${EMPRESA.nome} CNPJ ${EMPRESA.cnpj}`, pageWidth / 2, y, { align: 'center' });
  y += 40;

  doc.line(marginLeft, y, pageWidth - marginRight, y);
  y += 16;
  doc.text(`${compradorNome}  CPF: ${compradorCpf}`, pageWidth / 2, y, { align: 'center' });

  const nomeArquivo = `declaracao_venda_${compradorNome}`.replace(/\s+/g, '_').toLowerCase() + '.pdf';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  try {
    const pdfBlob = doc.output('blob');
    const blobUrl = URL.createObjectURL(pdfBlob);

    if (isIOS) {
      // iPhone (Safari) não permite forçar download via JS — abre o PDF na tela
      window.open(blobUrl, '_blank');
      setTimeout(() => {
        alert('O contrato abriu em uma nova aba.\n\nPra imprimir ou salvar: toque no ícone de compartilhar (o quadrado com a seta pra cima) e escolha "Imprimir" ou "Salvar em Arquivos".');
      }, 400);
    } else {
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = nomeArquivo;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
  } catch (err) {
    alert('Não foi possível baixar o PDF automaticamente. Vou abrir em uma nova aba, use o menu do navegador para salvar.\n\nDetalhe do erro: ' + err.message);
    try {
      const pdfBlob = doc.output('blob');
      const blobUrl = URL.createObjectURL(pdfBlob);
      window.open(blobUrl, '_blank');
    } catch (err2) {
      alert('Erro ao gerar o PDF: ' + err2.message);
    }
  }
}
