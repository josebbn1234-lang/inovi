<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOVI Veículos - Histórico de Contratos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f0d;
    color: #e6e6e6;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding: 30px 16px 80px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  header img.logo { max-width: 200px; width: 100%; height: auto; }
  header p { color: #999; margin-top: 6px; font-size: 0.88rem; }

  #telaSenha { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #telaSenha .box {
    max-width: 340px; width: 100%; background: #161814; border: 1px solid #2a2e26;
    border-radius: 14px; padding: 30px; text-align: center;
  }
  #telaSenha h2 { color: #b6ff3c; margin-bottom: 18px; font-size: 1.2rem; }
  #telaSenha p { color: #999; font-size: 0.85rem; margin-bottom: 16px; }
  #telaSenha input {
    width: 100%; background: #0d0f0d; border: 1px solid #333; color: #f0f0f0;
    padding: 12px; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; text-align: center;
  }
  #telaSenha button {
    width: 100%; background: #b6ff3c; color: #0d0f0d; border: none; padding: 12px;
    font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer;
  }
  #msgSenhaErrada { color: #ff5c5c; font-size: 0.82rem; margin-top: 12px; display: none; }

  .section {
    background: #161814; border: 1px solid #2a2e26; border-radius: 12px;
    padding: 20px; margin-bottom: 18px;
  }
  .contrato-card {
    background: #0f110d; border: 1px solid #2a2e26; border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .contrato-card .nome { font-weight: 700; color: #f0f0f0; font-size: 1rem; }
  .contrato-card .info { font-size: 0.82rem; color: #999; margin-top: 3px; }
  .contrato-card .total { font-size: 1rem; color: #b6ff3c; font-weight: 700; margin-top: 8px; }
  .contrato-card .data { font-size: 0.74rem; color: #666; margin-top: 4px; }

  .busca {
    width: 100%; background: #0d0f0d; border: 1px solid #333; color: #f0f0f0;
    padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px;
  }
  .contador { color: #999; font-size: 0.82rem; margin-bottom: 14px; text-align: right; }
  .vazio { color: #999; text-align: center; padding: 40px 10px; }
  .carregando { color: #999; text-align: center; padding: 40px 10px; }

  .btn-limpar {
    width: 100%; background: transparent; color: #ff8080; border: 1.5px solid #5a2020;
    padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.85rem;
    font-weight: 600; margin-top: 10px;
  }
  .btn-atualizar {
    width: 100%; background: transparent; color: #b6ff3c; border: 1.5px dashed #b6ff3c;
    padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.88rem;
    font-weight: 600; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="telaSenha">
  <div class="box">
    <h2>🔒 Histórico de Contratos</h2>
    <p>Digite a senha para acessar</p>
    <input type="password" id="inputSenha" placeholder="Senha" onkeydown="if(event.key==='Enter') verificarSenha()">
    <button onclick="verificarSenha()">Entrar</button>
    <p id="msgSenhaErrada">Senha incorreta. Tente de novo.</p>
  </div>
</div>

<div class="container" id="appConteudo" style="display:none;">
  <header>
    <img class="logo" id="logoHeader" alt="INOVI Veículos">
    <p>Histórico de Contratos Emitidos</p>
  </header>

  <div class="section">
    <button class="btn-atualizar" onclick="carregarHistorico()">🔄 Atualizar lista</button>
    <input type="text" class="busca" id="busca" placeholder="Buscar por nome, CPF ou veículo..." oninput="renderizarLista()">
    <div class="contador" id="contador"></div>
    <div id="listaHistorico"><div class="carregando">Carregando...</div></div>
    <button class="btn-limpar" onclick="limparHistorico()">🗑️ Limpar todo o histórico</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, limit, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA1MOx9m9BG7SruGzIOTk7-CcBwOR5VQOo",
    authDomain: "inovi-contratos.firebaseapp.com",
    projectId: "inovi-contratos",
    storageBucket: "inovi-contratos.firebasestorage.app",
    messagingSenderId: "1000167827719",
    appId: "1:1000167827719:web:07a0969f205e665c2a7da2",
    measurementId: "G-RNCYVX7DWW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.carregarContratosFirestore = async function () {
    const q = query(collection(db, "contratos"), orderBy("criadoEm", "desc"), limit(200));
    const snap = await getDocs(q);
    const registros = [];
    snap.forEach(d => registros.push({ id: d.id, ...d.data() }));
    return registros;
  };

  window.apagarTodosContratosFirestore = async function () {
    const q = query(collection(db, "contratos"), limit(500));
    const snap = await getDocs(q);
    const promises = [];
    snap.forEach(d => promises.push(deleteDoc(doc(db, "contratos", d.id))));
    await Promise.all(promises);
  };
</script>

document.getElementById('logoHeader').src = LOGO_BASE64;

// Mesma senha do formulário de emissão
const SENHA_CORRETA = 'inovi2026';

let todosContratos = [];

function verificarSenha() {
  const digitada = document.getElementById('inputSenha').value;
  if (digitada === SENHA_CORRETA) {
    document.getElementById('telaSenha').style.display = 'none';
    document.getElementById('appConteudo').style.display = 'block';
    try { sessionStorage.setItem('inoviAutenticadoHistorico', 'sim'); } catch (e) {}
    carregarHistorico();
  } else {
    document.getElementById('msgSenhaErrada').style.display = 'block';
    document.getElementById('inputSenha').value = '';
  }
}

try {
  if (sessionStorage.getItem('inoviAutenticadoHistorico') === 'sim') {
    document.getElementById('telaSenha').style.display = 'none';
    document.getElementById('appConteudo').style.display = 'block';
  }
} catch (e) {}

async function carregarHistorico() {
  const container = document.getElementById('listaHistorico');
  container.innerHTML = '<div class="carregando">Carregando...</div>';
  try {
    todosContratos = await window.carregarContratosFirestore();
    renderizarLista();
  } catch (e) {
    container.innerHTML = '<div class="vazio">Erro ao carregar o histórico: ' + e.message + '</div>';
  }
}

function renderizarLista() {
  const termo = (document.getElementById('busca').value || '').toLowerCase().trim();
  const container = document.getElementById('listaHistorico');
  const contador = document.getElementById('contador');

  const filtrados = todosContratos.filter(c => {
    if (!termo) return true;
    return (c.nome || '').toLowerCase().includes(termo) ||
           (c.cpf || '').toLowerCase().includes(termo) ||
           (c.veiculo || '').toLowerCase().includes(termo);
  });

  contador.textContent = `${filtrados.length} contrato(s)`;

  if (filtrados.length === 0) {
    container.innerHTML = '<div class="vazio">Nenhum contrato encontrado.</div>';
    return;
  }

  container.innerHTML = filtrados.map(c => `
    <div class="contrato-card">
      <div class="nome">${c.nome || '-'}</div>
      <div class="info">CPF: ${c.cpf || '-'}</div>
      <div class="info">${c.veiculo || '-'}</div>
      <div class="total">R$ ${c.total || '0,00'}</div>
      <div class="data">Emitido em ${c.dataEmissao || '-'}</div>
    </div>
  `).join('');
}

async function limparHistorico() {
  const confirmar1 = confirm('Isso vai apagar TODOS os contratos do histórico, de TODOS os celulares. Essa ação não pode ser desfeita. Tem certeza?');
  if (!confirmar1) return;
  const confirmar2 = confirm('Confirmação final: apagar TODO o histórico compartilhado agora?');
  if (!confirmar2) return;

  try {
    await window.apagarTodosContratosFirestore();
    alert('Histórico apagado com sucesso.');
    carregarHistorico();
  } catch (e) {
    alert('Erro ao apagar o histórico: ' + e.message);
  }
}
</script>
